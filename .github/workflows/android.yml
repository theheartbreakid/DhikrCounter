name: Android CI Release

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "zulu"

      - name: Decode Keystore from Secrets
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > "${{ github.workspace }}/app/release-keystore.jks"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Calculate Next Version
        id: version
        run: |
          git fetch --tags --force

          # Find the latest vX.Y.Z tag.
          LATEST_TAG=$(git tag -l 'v*.*.*' --sort=-v:refname | head -n 1)

          if [ -z "$LATEST_TAG" ]; then
            VERSION="1.0.0"
          else
            VERSION="${LATEST_TAG#v}"

            IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"

            PATCH=$((PATCH + 1))

            VERSION="${MAJOR}.${MINOR}.${PATCH}"
          fi

          TAG="v${VERSION}"

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

          echo "Latest existing tag: ${LATEST_TAG:-none}"
          echo "New version: ${VERSION}"
          echo "New tag: ${TAG}"

      - name: Wipe Cache and Build Fresh Release APK
        run: |
          ./gradlew clean assembleRelease \
            -Pandroid.injected.signing.store.file="${{ github.workspace }}/app/release-keystore.jks" \
            -Pandroid.injected.signing.store.password="${{ secrets.KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.KEY_PASSWORD }}" \
            -x test \
            -x lint

      - name: Verify Release APKs
        run: |
          test -f app/release/app-release.apk
          test -f app/build/outputs/apk/release/app-release.apk

          echo "Release APK:"
          ls -lh app/release/app-release.apk

          echo "Build APK:"
          ls -lh app/build/outputs/apk/release/app-release.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "${{ steps.version.outputs.tag }}"
          name: "${{ steps.version.outputs.tag }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            app/release/app-release.apk
            app/build/outputs/apk/release/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}