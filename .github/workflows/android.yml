name: Android CI Release

on:
  push:
    branches: [ "master" ] # Triggers instantly whenever you edit code or save files on master
  workflow_dispatch:      # Also gives you a manual "Run workflow" play button on your phone

permissions:
  contents: write         # Allows the cloud to create a release page and upload your APK

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'        # Fixed: Upgraded to Java 21 to match your Gradle 9.5.1
        distribution: 'zulu'
        
    - name: Decode Keystore from Secrets
      run: |
        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/release-keystore.jks

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Secure Release APK
      run: |
        ./gradlew assembleRelease \
          -Pandroid.injected.signing.store.file=release-keystore.jks \
          -Pandroid.injected.signing.store.password="${{ secrets.KEYSTORE_PASSWORD }}" \
          -Pandroid.injected.signing.key.alias="${{ secrets.KEY_ALIAS }}" \
          -Pandroid.injected.signing.key.password="${{ secrets.KEY_PASSWORD }}"

    - name: Automatic GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: "latest-build"   # Keeps updating a single release page named "latest-build"
        name: "Latest Production Build"
        draft: false
        prerelease: false
        files: app/release/app-release.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
