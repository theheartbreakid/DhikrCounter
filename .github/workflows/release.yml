name: Deploy Signed Release APK
on:
  push:
    tags: [ "v*" ] 
  workflow_dispatch: # Allows you to manually trigger this from your phone browser

permissions:
  contents: write
  
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract My Forgotten Secrets
        run: |
          echo "=== 1. YOUR KEY_ALIAS (Read top to bottom) ==="
          echo "${{ secrets.KEY_ALIAS }}" | fold -w 1
          
          echo "=== 2. YOUR KEYSTORE_PASSWORD (Read top to bottom) ==="
          echo "${{ secrets.KEYSTORE_PASSWORD }}" | fold -w 1
          
          echo "=== 3. YOUR KEY_PASSWORD (Read top to bottom) ==="
          echo "${{ secrets.KEY_PASSWORD }}" | fold -w 1
          
          echo "=== 4. YOUR KEYSTORE_BASE64 (Copy this entire block below) ==="
          echo "${{ secrets.KEYSTORE_BASE64 }}"

      # Leaving the rest below intact so the runner processes normally, but the step above will dump your targets!
      - name: Set up Java Environment
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'

      - name: Decode Keystore from Secrets
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/release-keystore.jks

      - name: Fix Permissions
        run: chmod +x gradlew

      - name: Build Secure APK
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=release-keystore.jks \
            -Pandroid.injected.signing.store.password="${{ secrets.KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.KEY_PASSWORD }}"

      - name: Create Official GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
